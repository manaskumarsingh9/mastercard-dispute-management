spring.application.name=mastercard-dispute-management
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:dispute_db}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=5000

# Mastercard API Configuration
mastercard.base-url=https://sandbox.api.mastercard.com
mastercard.consumer-key=***REMOVED_MASTERCARD_CONSUMER_KEY***
mastercard.keystore-password=***REMOVED_MASTERCARD_KEYSTORE_PASSWORD***
mastercard.keystore-path=src/main/resources/Opus Dispute Management System-sandbox-signing.p12

ingestion.scheduled.enabled=true
ingestion.scheduled.interval-ms=3600000
ingestion.scheduled.initial-delay-ms=60000

gemini.api-key=${GEMINI_API_KEY:}

# Ethoca Consumer Clarity API Configuration
ethoca.base-url=https://sandbox.api.ethocaweb.com
ethoca.api-key-id=${ETHOCA_API_KEY_ID:}
ethoca.api-secret=${ETHOCA_API_SECRET:}
